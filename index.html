<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14201b"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>BatonPass Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--paper:#f4f5f2;--ink:#14201b;--mute:#6a756f;--line:#d9ddd8;--ok:#1b7f4b;--okbg:#e2f2e8;--extra:#b86a00;--extrabg:#fdf0d9;--bad:#b3261e;--badbg:#fbe4e2;--rej:#5b3a99;--rejbg:#ece6f5;--card:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--ink);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:650;flex:1}
header button{background:none;border:0;color:#cfe3d8;font-size:14px;padding:6px}
main{padding:16px;max-width:560px;margin:0 auto;padding-bottom:110px}
h2{font-size:15px;margin:0 0 10px;font-weight:650}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font-size:17px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:3px solid #7bbf9b;outline-offset:1px}
.btn{width:100%;font-size:17px;font-weight:650;padding:14px;border-radius:10px;border:0;background:var(--ink);color:#fff;margin-top:12px}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.btn:disabled{opacity:.45}
.store{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;font-size:16px}
.store small{color:var(--mute);display:block;margin-top:2px}
.store b{font-size:20px}
.counts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.counts div{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 2px;text-align:center}
.counts b{display:block;font-size:20px}
.counts span{font-size:11px;line-height:1.15;color:var(--mute);display:block}
.counts .m b{color:var(--bad)}.counts .e b{color:var(--extra)}.counts .r b{color:var(--ok)}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:8px;margin-bottom:6px;font-size:15px;font-variant-numeric:tabular-nums;border:1px solid transparent}
.row.pending{background:#eceee9;color:#8a948e}
.row.matched{background:var(--okbg);color:var(--ok);font-weight:600}
.row.extra{background:var(--extrabg);color:var(--extra);font-weight:600}
.row.missing{background:var(--badbg);color:var(--bad);font-weight:600}
.row.rej{background:var(--rejbg);color:var(--rej);font-weight:600}
.tag{font-size:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;max-width:none;z-index:6}
.bar .btn{margin:0}
#reader{width:100%;border-radius:10px;overflow:hidden;background:#000}
.modal{position:fixed;inset:0;background:rgba(20,32,27,.7);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:18px}
.sheet p{margin:0 0 6px;color:var(--mute)}
.msg{padding:10px 12px;border-radius:8px;font-size:14px;margin-top:10px}
.msg.err{background:var(--badbg);color:var(--bad)}.msg.info{background:var(--okbg);color:var(--ok)}
.hidden{display:none}
.otp{letter-spacing:.5em;text-align:center;font-size:28px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chk{display:flex;align-items:center;gap:12px;padding:12px;margin:0 0 6px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-variant-numeric:tabular-nums;color:var(--ink)}
.chk input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--ok)}
.chk.all{background:var(--paper);font-weight:650}
.exlist{max-height:36vh;overflow-y:auto;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.link{width:100%;background:none;border:0;color:var(--mute);font-size:15px;padding:12px;margin-top:4px}
@media(prefers-reduced-motion:no-preference){.row{transition:background .25s}}
</style>
</head>
<body>
<header><h1 id="title">BatonPass Pro</h1><button id="back" class="hidden">Back</button><button id="logout" class="hidden">Log out</button></header>
<main id="app"></main>

<!-- shown right when an order that is not on the store's list is scanned -->
<div class="modal" id="askModal"><div class="sheet">
  <h3>This order is not assigned to you</h3>
  <p id="askId" style="font-weight:650;color:var(--ink);font-size:18px"></p>
  <p>Do you want to pick the order?</p>
  <button class="btn ok" id="askYes">Yes</button>
  <button class="btn bad" id="askNo">No</button>
</div></div>

<!-- shown after Done scanning, only when there are extra orders to confirm -->
<div class="modal" id="extraModal"><div class="sheet">
  <h3 id="exTitle">Extra orders</h3>
  <p id="exAsk">Extra orders pickup confirmation. Select the orders, then choose Yes or No: do you want to pick them?</p>
  <label class="chk all"><input type="checkbox" id="exAll"><span>Select all</span></label>
  <div class="exlist" id="exList"></div>
  <button class="btn ok" id="exAccept" disabled>Yes</button>
  <button class="btn bad" id="exReject" disabled>No</button>
  <button class="link" id="exBack">Back to scanning</button>
</div></div>

<script src="config.js"></script>
<script>
/* ====== CONFIG ====== */
const API_URL = window.API_URL || "";   // set in config.js (Apps Script web app URL ending in /exec)
const REQUIRE_ALL_TICKED = false;       // true: Yes/No unlock only when every extra order is ticked. false: unlock when at least one is ticked and apply to the ticked ones.
const DROPDOWN_ABOVE = 6;               // more stores than this -> store dropdown instead of buttons
const OFFER_INSTALL = true;             // true: after the first PIN change, offer one-click "add to home screen" (runner can skip)
/* ==================== */

const $ = s => document.querySelector(s);
const S = { runner:null, pin:null, store:null, orders:[], scanned:new Set(), extras:new Set(), newExtras:new Set(), rejected:new Set(), sel:new Set(), decisions:[], batch:null, scanner:null, scanning:false, started:false, finished:false, asking:false, lastScan:"", lastAt:0, resume:null };

/* ---------- API ---------- */
async function api(action, data={}){
  if(!API_URL) throw new Error("App is not set up. Add the Apps Script URL in config.js.");
  const body = JSON.stringify({action, runner_id:S.runner, pin:S.pin, ...data});
  const res = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
  return res.json();
}

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function nav(title, back){ $("#title").textContent=title; $("#back").classList.toggle("hidden",!back); $("#logout").classList.toggle("hidden",!S.runner); $("#back").onclick=back||null; }
function stats(){
  const matched=S.orders.filter(o=>S.scanned.has(o)), missing=S.orders.filter(o=>!S.scanned.has(o)), extra=[...S.extras,...S.newExtras], rejected=[...S.rejected];
  return {expected:S.orders.length, scanned:matched.length, missing, matched, extra, rejected, total:matched.length+extra.length};
}
function countsHtml(s){ return `<div class="counts">
  <div><b>${s.expected}</b><span>Expected</span></div><div><b>${s.scanned}</b><span>Scanned</span></div>
  <div class="m"><b>${s.missing.length}</b><span>Missing</span></div><div class="e"><b>${s.extra.length}</b><span>Extra</span></div>
  <div class="r"><b>${s.total}</b><span>Total picked</span></div></div>`; }
function beep(){ try{navigator.vibrate&&navigator.vibrate(60);}catch(e){} }
function resetStoreState(){ S.started=false; S.finished=false; S.asking=false; S.scanned=new Set(); S.extras=new Set(); S.newExtras=new Set(); S.rejected=new Set(); S.sel=new Set(); S.decisions=[]; S.batch=null; S.resume=null; }

/* ---------- saved progress: survives Back, logout and closing the app (per runner + store, on this device) ---------- */
const SKEY=()=>"bp_state_"+S.runner+"_"+(S.store?S.store.vendor:"");
function saveState(){
  if(!S.runner||!S.store) return;
  try{ localStorage.setItem(SKEY(),JSON.stringify({scanned:[...S.scanned],extras:[...S.extras],newExtras:[...S.newExtras],rejected:[...S.rejected],decisions:S.decisions,batch:S.batch,started:S.started,
    askCode:S.asking?$("#askId").textContent:"",popup:$("#extraModal").classList.contains("on")})); }catch(e){}
}
function clearState(){ try{localStorage.removeItem(SKEY());}catch(e){} }
function loadState(){
  try{ const d=JSON.parse(localStorage.getItem(SKEY())||"null"); if(!d) return;
    S.scanned=new Set((d.scanned||[]).filter(o=>S.orders.includes(o))); S.extras=new Set(d.extras||[]); S.newExtras=new Set(d.newExtras||[]); S.rejected=new Set(d.rejected||[]);
    S.decisions=d.decisions||[]; S.batch=d.batch||null; S.started=!!d.started; S.resume={ask:d.askCode||"",popup:!!d.popup};
  }catch(e){}
}

/* ---------- after login / PIN change: install step, then stores ---------- */
function afterAuth(){ gateOn=false; stores(); }
function afterPinSet(){
  if(OFFER_INSTALL&&!isStandalone()){ installGate(); return; }   // first login: offer the install, runner can skip
  afterAuth();
}

/* ---------- screens ---------- */
function login(err){
  $("#askModal").classList.remove("on"); $("#extraModal").classList.remove("on"); S.asking=false; S.store=null;
  gateOn=false; S.runner=null; S.pin=null; nav("BatonPass Pro");
  $("#app").innerHTML=`<div class="card"><h2>Runner login</h2>
    <label for="rid">Mobile number</label><input id="rid" autocomplete="username" inputmode="numeric">
    <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
    <div id="err">${err?`<div class="msg err">${esc(err)}</div>`:""}</div><button class="btn" id="go">Log in</button>
    <p style="margin:12px 0 0;color:var(--mute);font-size:14px">No account or forgot your PIN? Contact your manager.</p></div>`;
  $("#go").onclick=async()=>{
    const id=$("#rid").value.trim(), pin=$("#pin").value.trim(); if(!id||!pin){$("#err").innerHTML='<div class="msg err">Enter your mobile number and PIN.</div>';return;}
    S.runner=id;S.pin=pin; $("#go").disabled=true;
    try{ const r=await api("login"); if(!r.ok) throw new Error(r.error||"Login failed");
      localStorage.setItem("rh_user",JSON.stringify({id,pin})); r.must_change_pin?changePin():afterAuth();
    }catch(e){ S.runner=null;S.pin=null; $("#go").disabled=false; $("#err").innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
  };
}
function changePin(){
  nav("Set new PIN");
  $("#app").innerHTML=`<div class="card"><h2>Set your own PIN</h2>
    <p style="margin:0 0 4px;color:var(--mute)">You logged in with a PIN given to you. Choose a new PIN to continue.</p>
    <label for="np1">New PIN (4 to 6 digits)</label><input id="np1" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">
    <label for="np2">Confirm new PIN</label><input id="np2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">
    <div id="err"></div><button class="btn" id="save">Save PIN</button></div>`;
  $("#save").onclick=async()=>{
    const a=$("#np1").value.trim(), b=$("#np2").value.trim();
    if(!/^\d{4,6}$/.test(a)){$("#err").innerHTML='<div class="msg err">PIN must be 4 to 6 digits.</div>';return;}
    if(a!==b){$("#err").innerHTML='<div class="msg err">The two PINs do not match.</div>';return;}
    if(a===S.pin){$("#err").innerHTML='<div class="msg err">Choose a PIN different from the current one.</div>';return;}
    $("#save").disabled=true;
    try{ const r=await api("change_pin",{new_pin:a}); if(!r.ok) throw new Error(r.error||"Could not save PIN");
      S.pin=a; localStorage.setItem("rh_user",JSON.stringify({id:S.runner,pin:a})); afterPinSet();
    }catch(e){ $("#save").disabled=false; $("#err").innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
  };
}

/* ---------- home tabs: Stores | History ---------- */
function homeTabs(a){ return `<div class="tabs"><button data-t="stores" class="${a==="stores"?"on":""}">Stores</button><button data-t="history" class="${a==="history"?"on":""}">History</button></div>`; }
function wireTabs(){ document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>b.dataset.t==="history"?historyScreen():stores()); }
async function historyScreen(){
  nav("History"); $("#app").innerHTML=homeTabs("history")+`<p style="color:var(--mute)">Loading history…</p>`; wireTabs();
  try{ const r=await api("history"); if(!r.ok) throw new Error(r.error||"Could not load history");
    $("#app").innerHTML=homeTabs("history")+(r.batches.length?r.batches.map(b=>`<div class="card"><h2>${esc(b.store_name)}</h2>
      <p style="margin:0 0 8px;color:var(--mute);font-size:13px">${esc([b.vendor_code,b.verified_at].filter(Boolean).join(" · "))}<br>${esc(b.batch_id)}</p>
      ${countsHtml({expected:b.expected,scanned:b.scanned,missing:{length:b.missing},extra:{length:b.extra},total:b.total_picked})}
      <p style="margin:0;color:var(--rej);font-size:13px">Scanned but rejected: ${b.rejected}</p></div>`).join(""):`<div class="msg info">No completed batches yet.</div>`);
  }catch(e){ $("#app").innerHTML=homeTabs("history")+`<div class="msg err">${esc(e.message)}</div>`; }
  wireTabs();
}

async function stores(){
  nav("Select store");
  $("#app").innerHTML=`<p style="color:var(--mute)">Loading stores…</p>`;
  try{ const r=await api("stores"); if(!r.ok){ if(r.must_change_pin){changePin();return;} throw new Error(r.error); }
    const list=r.stores; let html=homeTabs("stores")+installBanner();
    if(!list.length) html+=`<div class="msg info">No stores with pending orders. If this looks wrong, contact your manager.</div>`;
    else if(list.length>DROPDOWN_ABOVE) html+=`<div class="card"><h2>Select store</h2><select id="storeSel"><option value="">Choose a store</option>${list.map(s=>`<option value="${esc(s.vendor)}">${esc(s.name)} (${s.count} orders)</option>`).join("")}</select><button class="btn" id="storeGo" disabled>Open store</button></div>`;
    else html+=list.map(s=>`<button class="store" data-v="${esc(s.vendor)}" data-n="${esc(s.name)}"><span>${esc(s.name)}<small>${esc([s.vendor,s.city].filter(Boolean).join(' · '))}</small></span><b>${s.count}</b></button>`).join("");
    $("#app").innerHTML=html;
    document.querySelectorAll(".store").forEach(b=>b.onclick=()=>openStore(b.dataset.v,b.dataset.n));
    const sel=$("#storeSel"); if(sel){ sel.onchange=()=>{$("#storeGo").disabled=!sel.value;}; $("#storeGo").onclick=()=>openStore(sel.value,list.find(x=>x.vendor===sel.value).name); }
    wireBanner(); wireTabs();
  }catch(e){ $("#app").innerHTML=`<div class="msg err">${esc(e.message||"Could not load stores")}</div><button class="btn" onclick="stores()">Try again</button>`; }
}
async function openStore(vendor,name){
  S.store={vendor,name}; resetStoreState();
  nav(name,()=>{stopScan();stores();});
  $("#app").innerHTML=`<p style="color:var(--mute)">Loading orders…</p>`;
  try{ const r=await api("orders",{vendor}); if(!r.ok) throw new Error(r.error); S.orders=r.orders; loadState(); scanScreen();
    if(S.resume){ const z=S.resume; S.resume=null; if(z.ask) askPick(z.ask); else if(z.popup&&S.newExtras.size) openExtraPopup(); }   // re-open a pending Yes/No
  }
  catch(e){ $("#app").innerHTML=`<div class="msg err">${esc(e.message||"Could not load orders")}</div>`; }
}
function scanScreen(){
  nav(S.store.name,()=>{stopScan();stores();});
  $("#app").innerHTML=`<div id="counts"></div>
    <div id="readerWrap" class="hidden"><div id="reader"></div><button class="btn alt" id="stop">Pause scanning</button></div>
    <div class="card" id="manual"><label for="mid" style="margin-top:0">Camera not reading? Type the order ID</label>
      <div style="display:flex;gap:8px"><input id="mid" autocapitalize="characters"><button class="btn" style="width:90px;margin:0" id="madd">Add</button></div></div>
    <div id="list"></div>
    <div class="bar"><button class="btn alt" id="scanBtn">Scan orders</button><button class="btn" id="doneBtn" disabled>Done scanning</button></div>`;
  $("#scanBtn").onclick=startScan; $("#stop").onclick=stopScan;
  $("#madd").onclick=()=>{const v=$("#mid").value.trim(); if(v){onCode(v);$("#mid").value="";}};
  $("#doneBtn").onclick=doneScan; $("#doneBtn").disabled=!S.started; render();
}
function render(){
  const s=stats(); $("#counts").innerHTML=countsHtml(s);
  const rows=S.orders.map(o=>S.scanned.has(o)?`<div class="row matched"><span>${esc(o)}</span><span class="tag">Scanned</span></div>`:S.finished?`<div class="row missing"><span>${esc(o)}</span><span class="tag">Missing</span></div>`:`<div class="row pending"><span>${esc(o)}</span><span class="tag">Not scanned</span></div>`);
  const ex=[...S.extras].map(o=>`<div class="row extra"><span>${esc(o)}</span><span class="tag">Extra</span></div>`).concat([...S.newExtras].map(o=>`<div class="row extra"><span>${esc(o)}</span><span class="tag">Extra · to confirm</span></div>`));
  const rj=[...S.rejected].map(o=>`<div class="row rej"><span>${esc(o)}</span><span class="tag">Rejected</span></div>`);
  $("#list").innerHTML=`<h2>Orders for this store</h2>${rows.join("")}${ex.length?`<h2 style="margin-top:14px">Extra orders</h2>${ex.join("")}`:""}${rj.length?`<h2 style="margin-top:14px">Order Scanned But Rejected</h2>${rj.join("")}`:""}`;
  saveState();
}

/* ---------- scanning ---------- */
async function startScan(){
  S.started=true; S.finished=false; $("#doneBtn").disabled=false; render();
  $("#readerWrap").classList.remove("hidden"); $("#manual").classList.add("hidden");
  if(S.scanner){ S.scanning=true; return; }
  S.scanner=new Html5Qrcode("reader",{formatsToSupport:[Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.QR_CODE],verbose:false});
  try{ await S.scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:140}},txt=>onCode(txt),()=>{}); S.scanning=true; }
  catch(e){ S.scanner=null; $("#readerWrap").classList.add("hidden"); $("#manual").classList.remove("hidden");
    $("#list").insertAdjacentHTML("afterbegin",`<div class="msg err">Camera not available. Allow camera access or type the order ID.</div>`); }
}
async function stopScan(){
  S.scanning=false; if(S.scanner){ try{await S.scanner.stop();}catch(e){} try{S.scanner.clear();}catch(e){} S.scanner=null; }
  const w=$("#readerWrap"); if(w) w.classList.add("hidden"); const m=$("#manual"); if(m) m.classList.remove("hidden");
}
function onCode(raw){
  const code=String(raw).trim(); const now=Date.now();
  if(!code||S.asking||(!S.scanning&&S.scanner)) return;
  if(code===S.lastScan&&now-S.lastAt<2500) return; S.lastScan=code;S.lastAt=now;
  if(S.scanned.has(code)||S.extras.has(code)||S.newExtras.has(code)){ beep(); return; }
  if(S.orders.includes(code)){ S.scanned.add(code); beep(); render(); return; }
  askPick(code);                         // not on this store's list: ask right away, before Done scanning
}

/* ---------- popup 1: order not assigned to you, pick it? (at scan time) ---------- */
function askPick(code){ S.asking=true; beep(); $("#askId").textContent=code; $("#askModal").classList.add("on"); saveState(); }
function answerPick(yes){
  const code=$("#askId").textContent, at=new Date().toISOString();
  $("#askModal").classList.remove("on");
  if(yes){ S.newExtras.add(code); S.rejected.delete(code); S.decisions.push({order_id:code,decision:"ACCEPTED",stage:"SCAN",at}); }   // added to Extra, confirmed again after Done scanning
  else   { S.rejected.add(code); S.decisions.push({order_id:code,decision:"REJECTED",stage:"SCAN",at}); }                              // nothing changes; shown as Rejected in the email
  S.asking=false; S.lastScan=code; S.lastAt=Date.now(); render();
}
$("#askYes").onclick=()=>answerPick(true);
$("#askNo").onclick=()=>answerPick(false);

/* ---------- popup 2: extra orders pickup confirmation (after Done scanning, only when there are extras to confirm) ---------- */
function openExtraPopup(){ S.sel=new Set(); renderPopup(); $("#extraModal").classList.add("on"); saveState(); }
function renderPopup(){
  const list=[...S.newExtras];
  $("#exTitle").textContent=`Extra orders (${list.length})`;
  $("#exList").innerHTML=list.map(o=>`<label class="chk"><input type="checkbox" data-o="${esc(o)}" ${S.sel.has(o)?"checked":""}><span>${esc(o)}</span></label>`).join("");
  $("#exList").querySelectorAll("input").forEach(i=>i.onchange=()=>{ i.checked?S.sel.add(i.dataset.o):S.sel.delete(i.dataset.o); syncPopup(); });
  syncPopup();
}
function syncPopup(){
  const n=S.newExtras.size, k=S.sel.size;
  $("#exAll").checked=n>0&&k===n; $("#exAll").indeterminate=k>0&&k<n;
  $("#exAccept").disabled=$("#exReject").disabled=REQUIRE_ALL_TICKED?(k!==n):(k===0);   // greyed until orders are selected
}
$("#exAll").onchange=e=>{ S.sel=e.target.checked?new Set(S.newExtras):new Set(); renderPopup(); };
$("#exBack").onclick=()=>{ $("#extraModal").classList.remove("on"); saveState(); };
$("#exAccept").onclick=()=>decide(true);
$("#exReject").onclick=()=>decide(false);
function decide(yes){
  const at=new Date().toISOString();
  [...S.sel].forEach(o=>{
    S.newExtras.delete(o);
    if(yes){ S.extras.add(o); S.rejected.delete(o); S.decisions.push({order_id:o,decision:"ACCEPTED",stage:"DONE",at}); }   // pickup confirmed: stays in Extra
    else   { S.rejected.add(o); S.decisions.push({order_id:o,decision:"REJECTED",stage:"DONE",at}); }                       // not picked: nothing added, shown as Rejected in the email
  });
  S.sel=new Set(); render();
  if(S.newExtras.size) renderPopup(); else { $("#extraModal").classList.remove("on"); submitDone(); }
}

/* ---------- done + OTP ---------- */
async function doneScan(){
  await stopScan(); const s=stats();
  if(!S.batch&&!s.matched.length&&!s.extra.length){ alert("Scan at least one order first."); return; }
  if(S.newExtras.size){ openExtraPopup(); return; }
  submitDone();
}
async function submitDone(){
  const s=stats();
  if(!S.batch&&!s.matched.length&&!s.extra.length){ alert("No orders left to hand over."); scanScreen(); return; }
  S.finished=true; render(); $("#doneBtn").disabled=true; $("#doneBtn").textContent="Sending OTP…";
  try{ const r=await api("done",{vendor:S.store.vendor,store:S.store.name,matched:s.matched,extra:s.extra,rejected:s.rejected,decisions:S.decisions});
    if(!r.ok){ if(r.must_change_pin){changePin();return;} throw new Error(r.error||"Could not create handover"); }
    S.batch=r.batch_id; S.decisions=[]; saveState(); otpScreen(r);
  }catch(e){ alert(e.message); S.finished=false; render(); $("#doneBtn").disabled=false; $("#doneBtn").textContent="Done scanning"; }
}
function otpScreen(r){
  const s=stats(); nav("Enter OTP",()=>{S.started=false;S.finished=false;scanScreen();});
  const bad=r&&r.otp_sent&&r.email_status&&r.email_status!=="SENT";   // email failed or no store email is tagged
  const note=bad?(r.email_status==="NO_EMAIL"?"No store email is set up for this store. Ask your manager for the OTP.":"The email could not be sent to the store. Ask your manager for the OTP."):r&&r.unchanged?"No new orders scanned. The OTP already sent to the store is still valid for 10 minutes.":(r&&r.otp_sent?"A new OTP was emailed to the store. It is valid for 10 minutes.":"The OTP was emailed to the store.");
  $("#app").innerHTML=`${countsHtml(s)}
    <div class="card"><h2>Ask the store for the OTP</h2><p style="margin:0 0 4px;color:var(--mute)">${note}</p>${bad?"":'<p style="margin:0 0 4px;color:var(--mute);font-size:13px">Store did not get the email? Ask your manager for the OTP.</p>'}
    <label for="otp">OTP</label><input id="otp" class="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
    <div id="err"></div><button class="btn ok" id="verify">Confirm handover</button>
    <button class="btn alt" id="more">Scan more orders</button></div>
    ${s.rejected.length?`<h2>Order Scanned But Rejected (${s.rejected.length})</h2>`+s.rejected.map(o=>`<div class="row rej"><span>${esc(o)}</span><span class="tag">Not picked</span></div>`).join(""):""}
    ${s.missing.length?`<h2>Missing (${s.missing.length})</h2>`+s.missing.map(o=>`<div class="row missing"><span>${esc(o)}</span><span class="tag">Not received</span></div>`).join(""):""}`;
  $("#more").onclick=()=>{S.started=false;S.finished=false;scanScreen();};
  $("#verify").onclick=async()=>{
    const otp=$("#otp").value.trim(); if(!otp){$("#err").innerHTML='<div class="msg err">Enter the OTP.</div>';return;}
    $("#verify").disabled=true;
    try{ const r=await api("verify",{batch_id:S.batch,otp}); if(!r.ok) throw new Error(r.error||"Wrong OTP"); success(r.summary); }
    catch(e){ $("#verify").disabled=false; $("#err").innerHTML=`<div class="msg err">${esc(e.message)}</div>`; }
  };
}
function success(sm){
  clearState();
  nav("Handover complete");
  const L=sm?{expected:sm.expected,scanned:sm.scanned,missing:sm.missing_list||[],extra:sm.extra_list||[],matched:sm.matched_list||[],total:sm.total_picked}
           :(()=>{const s=stats();return {expected:s.expected,scanned:s.scanned,missing:s.missing,extra:s.extra,matched:s.matched,total:s.total};})();
  const block=(title,list,cls,tag)=>`<h2 style="margin-top:14px">${title} (${list.length})</h2>`+(list.length?list.map(o=>`<div class="row ${cls}"><span>${esc(o)}</span><span class="tag">${tag}</span></div>`).join(""):`<p style="margin:0;color:var(--mute)">None</p>`);
  $("#app").innerHTML=`<div class="msg info" style="margin:0 0 12px">Handover complete. The store has been sent a closure email.</div>${countsHtml(L)}
    ${block("Missing orders",L.missing,"missing","Missing")}${block("Extra orders",L.extra,"extra","Extra")}${block("Scanned orders",L.matched,"matched","Scanned")}
    <button class="btn" style="margin-top:16px" onclick="stores()">Back to stores</button>`;
}

/* ---------- add to home screen ---------- */
let deferredInstall=null, gateOn=false;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(gateOn)installGate();});
window.addEventListener("appinstalled",()=>{deferredInstall=null;if(gateOn)installGate(INSTALLED_MSG);});
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function installBanner(){
  if(isStandalone()||!deferredInstall||localStorage.getItem("rh_noinstall")) return "";
  return `<div class="card" style="display:flex;gap:8px;align-items:center"><span style="flex:1">Add BatonPass Pro to your home screen</span>
    <button class="btn" style="width:auto;margin:0;padding:10px 14px" id="bannerInst">Add</button>
    <button class="btn alt" style="width:auto;margin:0;padding:10px 12px" id="bannerNo">Later</button></div>`;
}
function wireBanner(){
  const a=$("#bannerInst"); if(!a) return;
  a.onclick=async()=>{ deferredInstall.prompt(); try{await deferredInstall.userChoice;}catch(e){} deferredInstall=null; stores(); };
  $("#bannerNo").onclick=()=>{ localStorage.setItem("rh_noinstall","1"); stores(); };
}

/* ---------- install gate: Yes / No after the first PIN change. Android: Yes opens the one-tap install. iPhone/iPad: Yes shows the manual steps ---------- */
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const INSTALLED_MSG="BatonPass Pro is now on your home screen. Close this page and tap the BatonPass Pro icon to open it.";
function installGate(msg,help){
  gateOn=true; nav("Install BatonPass Pro");
  const steps=l=>`<ol style="margin:10px 0 0;padding-left:22px;line-height:1.7;text-align:left">${l.map(x=>`<li>${x}</li>`).join("")}</ol>`;
  let how;
  if(msg) how=`<div class="msg info">${esc(msg)}</div><button class="btn" id="gateGo">Continue</button>`;
  else{
    how=`<button class="btn ok" id="gateInstall" style="font-size:19px;padding:16px">Yes</button>`;
    if(help){
      how+=`<div class="msg info" style="color:var(--ink)">This phone needs one extra step. Follow these:</div>`+(isIOS()
        ?steps(["Tap the <b>Share</b> button at the bottom of Safari.","Choose <b>Add to Home Screen</b>, then tap <b>Add</b>.","Open <b>BatonPass Pro</b> from your home screen."])
        :steps(["Tap the <b>menu</b> (three dots) at the top of the browser.","Choose <b>Install app</b> or <b>Add to Home screen</b>.","Open <b>BatonPass Pro</b> from your home screen."]));
    }
  }
  $("#app").innerHTML=`<div class="card" style="text-align:center"><img src="icon-192.png" alt="" width="72" height="72" style="border-radius:16px;margin:4px 0 10px" onerror="this.style.display='none'">
    <h2 style="font-size:18px">Do you want to add BatonPass Pro to your home screen?</h2>
    <p style="margin:0 0 4px;color:var(--mute)">Your PIN is saved. Add BatonPass Pro to your phone so it opens like any other app.</p>${how}
    ${msg?"":'<button class="btn alt" id="gateSkip">No</button>'}</div>
    <p style="color:var(--mute);font-size:14px">Already installed? Open BatonPass Pro from your home screen, not from the browser.</p>`;
  const sk=$("#gateSkip"); if(sk) sk.onclick=afterAuth;
  const go=$("#gateGo"); if(go) go.onclick=afterAuth;
  const b=$("#gateInstall");
  if(b) b.onclick=async()=>{
    if(!deferredInstall){ installGate(null,true); return; }          // iOS or no one-tap install: show the steps
    let c=null; try{ deferredInstall.prompt(); c=await deferredInstall.userChoice; }catch(e){}
    deferredInstall=null;
    if(c&&c.outcome==="accepted") installGate(INSTALLED_MSG); else installGate(null,true);
  };
}

/* ---------- boot ---------- */
$("#logout").onclick=()=>{localStorage.removeItem("rh_user");stopScan();login();};
(async()=>{
  let u=null; try{ u=JSON.parse(localStorage.getItem("rh_user")||"null"); }catch(e){}
  if(!u){ login(); return; }
  S.runner=u.id; S.pin=u.pin;
  try{ const r=await api("login"); if(!r.ok){ localStorage.removeItem("rh_user"); login(r.error); return; } r.must_change_pin?changePin():afterAuth();
  }catch(e){ afterAuth(); }
})();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
