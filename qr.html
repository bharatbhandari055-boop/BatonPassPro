<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BatonPassPro - QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{font-family:system-ui,sans-serif;background:#f4f5f2;color:#14201b;text-align:center;padding:24px}
#qr{display:inline-block;background:#fff;padding:16px;border-radius:12px;border:1px solid #d9ddd8;margin:16px 0}
input{width:100%;max-width:440px;padding:12px;font-size:15px;border:1px solid #d9ddd8;border-radius:8px}
button{padding:12px 18px;font-size:15px;font-weight:650;border:0;border-radius:8px;background:#14201b;color:#fff;margin:8px 4px}</style></head>
<body><h1>BatonPassPro</h1><p>Scan with the phone camera to open the app</p>
<div id="qr"></div><br>
<input id="u" aria-label="App link"><br>
<button id="g">Update QR</button><button id="d">Download PNG</button>
<script>
const u=document.getElementById('u'),q=document.getElementById('qr');
u.value=new URLSearchParams(location.search).get('u')||new URL('index.html',location.href).href;
function make(){q.innerHTML='';new QRCode(q,{text:u.value.trim(),width:300,height:300,correctLevel:QRCode.CorrectLevel.M});}
document.getElementById('g').onclick=make;
document.getElementById('d').onclick=()=>{const c=q.querySelector('canvas');if(!c)return;const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='BatonPassPro-QR.png';a.click();};
make();
</script></body></html>
